<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pechan Stone</title>
<meta name="description" content="Contacta a Pechan Stone por WhatsApp o Instagram.">
<meta property="og:title" content="Pechan Stone">
<meta property="og:description" content="Contacta a Pechan Stone por WhatsApp o Instagram.">
<meta property="og:type" content="website">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap">
<style>
  /* Layout: una sola columna centrada para el celular, marca arriba y dos botones grandes apilados. */
  :root {
    --bg: #e9ebed;
    --surface: #f6f7f8;
    --ink: #1d2327;
    --muted: #5b666d;
    --line: #cdd2d6;
    --wa: #1f9d55;
    --wa-ink: #ffffff;
    --ig: #2a3138;
    --ig-ink: #ffffff;
    --overlay: rgba(16, 20, 23, 0.55);
    --overlay-ink: #ffffff;
    --video-bg: #0e1214;
    --font-display: "Space Grotesk", "Helvetica Neue", Arial, sans-serif;
    --font-body: "Inter", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14181b;
      --surface: #1c2125;
      --ink: #eef0f1;
      --muted: #9aa5ac;
      --line: #2e353a;
      --wa: #2bb86a;
      --wa-ink: #08210f;
      --ig: #e6e9eb;
      --ig-ink: #14181b;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #14181b;
    --surface: #1c2125;
    --ink: #eef0f1;
    --muted: #9aa5ac;
    --line: #2e353a;
    --wa: #2bb86a;
    --wa-ink: #08210f;
    --ig: #e6e9eb;
    --ig-ink: #14181b;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html { color-scheme: light; }
  body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.5;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 32px;
    min-height: 100vh;
  }
  main {
    max-width: 420px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 28px;
  }
  header { display: flex; flex-direction: column; gap: 10px; }
  .eyebrow {
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 500;
  }
  h1 {
    margin: 0;
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 44px;
    line-height: 1.05;
    letter-spacing: -0.02em;
    text-wrap: balance;
  }
  .lead { margin: 0; color: var(--muted); max-width: 34ch; }
  .rule { height: 1px; background: var(--line); border: 0; margin: 0; }

  .actions { display: flex; flex-direction: column; gap: 14px; }
  .btn {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 18px 20px;
    border-radius: 14px;
    text-decoration: none;
    min-width: 0;
    transition: transform 0.12s ease, filter 0.12s ease;
  }
  .btn:hover { filter: brightness(1.05); }
  .btn:active { transform: scale(0.985); }
  .btn:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  .btn svg { flex: none; width: 34px; height: 34px; }
  .btn .txt { display: flex; flex-direction: column; min-width: 0; }
  .btn .name { font-family: var(--font-display); font-weight: 700; font-size: 21px; line-height: 1.2; }
  .btn .sub { font-size: 14px; opacity: 0.85; overflow-wrap: anywhere; }
  .btn.wa { background: var(--wa); color: var(--wa-ink); }
  .btn.ig { background: var(--ig); color: var(--ig-ink); }
  .arrow { margin-left: auto; flex: none; width: 22px; height: 22px; opacity: 0.8; }

  footer { font-size: 13px; color: var(--muted); }

  /* Carrusel de fotos: se desliza con el dedo (scroll-snap), con flechas y puntos. */
  .gallery { display: flex; flex-direction: column; gap: 14px; }
  .gallery-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .gallery-head h2 {
    margin: 0;
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 22px;
    letter-spacing: -0.01em;
  }
  .count { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .slider { position: relative; }
  .track {
    display: flex;
    gap: 12px;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    scroll-behavior: smooth;
    overscroll-behavior-x: contain;
    scrollbar-width: none;
    border-radius: 18px;
    -webkit-overflow-scrolling: touch;
  }
  .track::-webkit-scrollbar { display: none; }
  .track:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  .slide {
    flex: 0 0 100%;
    min-width: 0;
    margin: 0;
    aspect-ratio: 1 / 1;
    border-radius: 18px;
    overflow: hidden;
    background: var(--line);
    scroll-snap-align: center;
    transition: transform 0.5s cubic-bezier(0.2, 0.7, 0.2, 1), opacity 0.5s ease;
  }
  .slide { position: relative; }
  .slide img { display: block; width: 100%; height: 100%; object-fit: cover; }

  /* Videos verticales: se ven completos sobre un fondo con la misma imagen desenfocada. */
  .slide.video { background: var(--video-bg); }
  .slide.video::before {
    content: "";
    position: absolute;
    inset: -24px;
    background: var(--poster) center / cover no-repeat;
    filter: blur(22px) brightness(0.6);
  }
  .slide video {
    position: relative;
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
    cursor: pointer;
    background: transparent;
  }
  .slide video:focus-visible { outline: 3px solid var(--overlay-ink); outline-offset: -6px; }
  .play {
    position: absolute;
    inset: 0;
    margin: auto;
    width: 64px;
    height: 64px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: var(--overlay);
    color: var(--overlay-ink);
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
    pointer-events: none;
    opacity: 0;
    transform: scale(0.85);
    transition: opacity 0.25s ease, transform 0.25s ease;
  }
  .play svg { width: 26px; height: 26px; margin-left: 3px; }
  .slide.is-paused .play { opacity: 1; transform: scale(1); }
  .slider.is-ready .slide:not(.is-active) { opacity: 0.5; transform: scale(0.94); }

  .nav {
    position: absolute;
    top: 50%;
    width: 42px;
    height: 42px;
    padding: 0;
    border: 0;
    border-radius: 50%;
    display: grid;
    place-items: center;
    cursor: pointer;
    background: var(--overlay);
    color: var(--overlay-ink);
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
    transform: translateY(-50%);
    transition: transform 0.15s ease, background 0.15s ease;
  }
  .nav svg { width: 20px; height: 20px; }
  .nav.prev { left: 10px; }
  .nav.next { right: 10px; }
  .nav:hover { transform: translateY(-50%) scale(1.08); }
  .nav:active { transform: translateY(-50%) scale(0.94); }
  .nav:focus-visible { outline: 3px solid var(--overlay-ink); outline-offset: 2px; }

  .dots { display: flex; justify-content: center; align-items: center; gap: 10px; min-height: 8px; }
  .dots button {
    position: relative;
    width: 8px;
    height: 8px;
    padding: 0;
    border: 0;
    border-radius: 99px;
    cursor: pointer;
    background: var(--muted);
    opacity: 0.4;
    transition: width 0.35s cubic-bezier(0.2, 0.7, 0.2, 1), opacity 0.35s ease, background 0.35s ease;
  }
  .dots button::before { content: ""; position: absolute; inset: -12px -5px; }
  .dots button[aria-current="true"] { width: 24px; opacity: 1; background: var(--ink); }
  .dots button:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }

  @media (prefers-reduced-motion: reduce) {
    .btn, .slide, .nav, .dots button, .play { transition: none; }
    .track { scroll-behavior: auto; }
  }
</style>

</head>
<body>
<main>
  <header>
    <span class="eyebrow">Contacto</span>
    <h1>Pechan Stone</h1>
    <p class="lead">Elige cómo quieres hablar con nosotros.</p>
  </header>

  <hr class="rule">

  <nav class="actions" aria-label="Canales de contacto">
    <a class="btn wa" href="https://wa.me/56928525722?text=Hola%2C%20vi%20su%20dise%C3%B1o%20y%20quiero%20m%C3%A1s%20informaci%C3%B3n" target="_blank" rel="noopener">
      <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M16 3.5a12.5 12.5 0 0 0-10.7 19L3.5 28.5l6.2-1.7A12.5 12.5 0 1 0 16 3.5Z"/>
        <path d="M11.6 10.4c.4-.6 1.2-.6 1.5 0l1 2.1c.2.4.1.8-.2 1.1l-.7.8c.9 1.7 2.3 3 4.1 3.9l.8-.9c.3-.3.7-.4 1.1-.2l2.1 1c.6.3.7 1.1.2 1.6-1 1.2-2.5 1.7-4.1 1.3-3.8-1-6.6-3.9-7.5-7.6-.2-1 .1-1.8.7-2.3Z" fill="currentColor" stroke="none"/>
      </svg>
      <span class="txt">
        <span class="name">WhatsApp</span>
        <span class="sub">+56 9 2852 5722</span>
      </span>
      <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </a>

    <a class="btn ig" href="https://www.instagram.com/pechan_stone/" target="_blank" rel="noopener">
      <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="4.5" y="4.5" width="23" height="23" rx="7"/>
        <circle cx="16" cy="16" r="5.5"/>
        <circle cx="22.6" cy="9.4" r="1.2" fill="currentColor" stroke="none"/>
      </svg>
      <span class="txt">
        <span class="name">Instagram</span>
        <span class="sub">@pechan_stone</span>
      </span>
      <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </a>
  </nav>

  <footer>Escríbenos por WhatsApp para cotizar o ver más diseños.</footer>

  <section class="gallery" aria-labelledby="gallery-title">
    <div class="gallery-head">
      <h2 id="gallery-title">Nuestros trabajos</h2>
      <span class="count" id="count">1 / 9</span>
    </div>

    <div class="slider" id="slider">
      <div class="track" id="track" tabindex="0" role="group" aria-roledescription="carrusel" aria-label="Fotos de cocinas">
        <figure class="slide is-active">
          <img src="img/cocina-1.jpg" width="960" height="960" decoding="async" alt="Cocina con isla de cubierta negra, muebles oscuros y piso de porcelanato">
        </figure>
        <figure class="slide">
          <img src="img/cocina-2.jpg" width="960" height="960" loading="lazy" decoding="async" alt="Cocina moderna con isla negra y cuatro banquetas altas">
        </figure>
        <figure class="slide">
          <img src="img/cocina-3.jpg" width="960" height="960" loading="lazy" decoding="async" alt="Cocina con muebles grises brillantes, cubierta oscura y banquetas">
        </figure>
        <figure class="slide">
          <img src="img/cocina-4.jpg" width="737" height="894" loading="lazy" decoding="async" alt="Cocina angosta con cubierta blanca, muebles grises y encimera de gas negra">
        </figure>
        <figure class="slide">
          <img src="img/cocina-5.jpg" width="738" height="905" loading="lazy" decoding="async" alt="Cocina con muebles grises brillantes y cajones abiertos">
        </figure>
        <figure class="slide video" style="--poster: url('img/video-1.jpg')">
          <video src="img/video-1.mp4" poster="img/video-1.jpg" width="576" height="1248" muted playsinline controls preload="metadata" tabindex="0" aria-label="Video: cubierta de cocina de piedra blanca con vetas. Toca para pausar o reproducir."></video>
          <span class="play" aria-hidden="true"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l13-7.5z"/></svg></span>
        </figure>
        <figure class="slide video" style="--poster: url('img/video-2.jpg')">
          <video src="img/video-2.mp4" poster="img/video-2.jpg" width="464" height="832" muted playsinline controls preload="metadata" tabindex="0" aria-label="Video: cocina con muebles blancos y horno empotrado. Toca para pausar o reproducir."></video>
          <span class="play" aria-hidden="true"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l13-7.5z"/></svg></span>
        </figure>
        <figure class="slide video" style="--poster: url('img/video-3.jpg')">
          <video src="img/video-3.mp4" poster="img/video-3.jpg" width="464" height="832" muted playsinline controls preload="metadata" tabindex="0" aria-label="Video: mueble de cocina gris con cubierta y frontis de piedra blanca con vetas. Toca para pausar o reproducir."></video>
          <span class="play" aria-hidden="true"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l13-7.5z"/></svg></span>
        </figure>
        <figure class="slide video" style="--poster: url('img/video-4.jpg')">
          <video src="img/video-4.mp4" poster="img/video-4.jpg" width="288" height="384" muted playsinline controls preload="metadata" tabindex="0" aria-label="Video: cubierta de piedra blanca con vetas y lavaplatos empotrado. Toca para pausar o reproducir."></video>
          <span class="play" aria-hidden="true"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l13-7.5z"/></svg></span>
        </figure>
      </div>

      <button class="nav prev" id="prev" type="button" aria-label="Foto anterior">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
      </button>
      <button class="nav next" id="next" type="button" aria-label="Foto siguiente">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </div>

    <div class="dots" id="dots"></div>
  </section>
</main>

<script>
(function () {
  var slider = document.getElementById('slider');
  var track = document.getElementById('track');
  if (!slider || !track) return;
  var slides = Array.prototype.slice.call(track.children);
  var dotsWrap = document.getElementById('dots');
  var count = document.getElementById('count');
  var reduce = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  var index = 0, raf = 0, timer = 0, inView = true, resumeVideo = null;

  function step() {
    return slides.length > 1 ? slides[1].offsetLeft - slides[0].offsetLeft : track.clientWidth;
  }
  function goTo(i) {
    i = (i + slides.length) % slides.length;
    track.scrollTo({ left: i * step(), behavior: reduce ? 'auto' : 'smooth' });
  }

  var dots = slides.map(function (_, n) {
    var b = document.createElement('button');
    b.type = 'button';
    b.setAttribute('aria-label', 'Ir a la foto ' + (n + 1));
    b.addEventListener('click', function () { stop(); goTo(n); });
    dotsWrap.appendChild(b);
    return b;
  });

  function update() {
    raf = 0;
    var s = step() || 1;
    var i = Math.max(0, Math.min(slides.length - 1, Math.round(track.scrollLeft / s)));
    var changed = i !== index || !slides[i].classList.contains('is-active');
    index = i;
    slides.forEach(function (el, n) { el.classList.toggle('is-active', n === i); });
    dots.forEach(function (d, n) { d.setAttribute('aria-current', n === i ? 'true' : 'false'); });
    if (count) count.textContent = (i + 1) + ' / ' + slides.length;
    slides.forEach(function (el, n) {
      var v = videoOf(el);
      if (!v) return;
      if (n === i) { if (changed) { v.currentTime = 0; play(v); } }
      else if (!v.paused) { v.pause(); }
    });
  }

  function videoOf(el) { return el ? el.querySelector('video') : null; }
  function play(v) { var p = v.play(); if (p && p.catch) p.catch(function () {}); }

  function stop() { if (timer) { clearInterval(timer); timer = 0; } }
  function start() {
    if (reduce || slides.length < 2) return;
    timer = setInterval(function () {
      if (document.hidden || !inView) return;
      var v = videoOf(slides[index]);
      if (v && !v.paused && !v.ended) return; // deja terminar el video
      goTo(index + 1);
    }, 4500);
  }

  track.addEventListener('scroll', function () { if (!raf) raf = requestAnimationFrame(update); }, { passive: true });
  ['pointerdown', 'touchstart', 'wheel', 'keydown'].forEach(function (ev) {
    track.addEventListener(ev, stop, { passive: true });
  });
  slides.forEach(function (el) {
    var v = videoOf(el);
    if (!v) return;
    v.controls = false;
    v.removeAttribute('controls');
    function sync() { el.classList.toggle('is-paused', v.paused); }
    ['play', 'playing', 'pause', 'ended'].forEach(function (ev) { v.addEventListener(ev, sync); });
    v.addEventListener('ended', function () {
      if (timer) { goTo(index + 1); } else { v.currentTime = 0; play(v); }
    });
    function toggle() { if (v.paused) { play(v); } else { v.pause(); } }
    v.addEventListener('click', toggle);
    v.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); }
    });
    sync();
  });

  document.getElementById('prev').addEventListener('click', function () { stop(); goTo(index - 1); });
  document.getElementById('next').addEventListener('click', function () { stop(); goTo(index + 1); });
  window.addEventListener('resize', function () {
    track.scrollTo({ left: index * step(), behavior: 'auto' });
  });

  if ('IntersectionObserver' in window) {
    new IntersectionObserver(function (entries) {
      inView = entries[0].isIntersecting;
      var v = videoOf(slides[index]);
      if (!inView && v && !v.paused) { v.pause(); resumeVideo = v; }
      else if (inView && resumeVideo) { play(resumeVideo); resumeVideo = null; }
    }, { threshold: 0.5 }).observe(slider);
  }

  slider.classList.add('is-ready');
  update();
  start();
})();
</script>
</body>
</html>
